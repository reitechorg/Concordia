name: Build client

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'
jobs:
    build:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]

        runs-on: ${{ matrix.os }}

        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Install Linux packaging dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libarchive-tools
            - name: Install Node.js and pnpm
              uses: pnpm/setup@v3
              with:
                  runtime: node@26
                  install: false
            - name: Setup task
              uses: go-task/setup-task@v2
            - name: Build interface & app
              run: task install publish
              env:
                  GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
