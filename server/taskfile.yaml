version: '3'

tasks:
    install:
        cmds:
            - pnpm install

    dev:
        cmds:
            - pnpm dev

    build:
        cmds:
            - npx prisma generate
            - |
                sh -c '
                VERSION=$(node -p "require(\"./package.json\").version")

                npx esbuild \
                src/start.ts \
                src/index.ts \
                --bundle \
                --platform=node \
                --target=node26 \
                --external:node:* \
                --outdir=./build \
                --format=esm \
                --define:__APP_VERSION__="\"$VERSION\"" \
                --banner:js="import { createRequire } from \"node:module\"; const require = createRequire(import.meta.url);"
                '
            - node --build-sea sea-config.json

    start:
        deps: [migrate-dev]
        cmds:
            - pnpm start

    migrate-dev:
        sources:
            - './prisma/**/*.prisma'
        cmds:
            - pnpm prisma migrate dev
